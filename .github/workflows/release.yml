name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release-dry-run.sh"
      - "scripts/verify-release-tag.sh"
      - "scripts/changelog-notes.py"
      - "scripts/release-manifest.py"
      - "scripts/release-sbom.py"
      - "scripts/validate-release.sh"
      - "security/**"
      - "CHANGELOG.md"
      - "runtime/sql/**"
      - "runtime/python/Dockerfile"
      - "runtime/python/requirements.txt"
      - "runtime/python/kako_run.py"
      - "docs/decisions/0008-release-artifacts.md"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its previous run; other events run
# every commit. The workflow name keeps workflows from cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pull requests and workflow_dispatch are dry runs: they package the same
# files and never mint attestations, push images, or create a Release.
jobs:
  scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash scripts/validate-release.sh

  verify-tag:
    name: Verify signed tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # Full history: the signer allowlist is read from origin/main, and the
      # tagged commit must be on main or a release/v* branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # checkout may leave a lightweight ref; fetch the real tag object.
      - name: Fetch annotated tag object
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - name: Refuse unsigned, lightweight, or mismatched tags
        run: bash scripts/verify-release-tag.sh verify "${GITHUB_REF_NAME}" "${GITHUB_SHA}"

  package:
    name: Package artifacts
    needs: [scripts, verify-tag]
    if: ${{ !cancelled() && needs.scripts.result == 'success' && (needs.verify-tag.result == 'success' || needs.verify-tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Package
        run: |
          extra=()
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            extra+=(--version "${GITHUB_REF_NAME#v}")
          fi
          bash scripts/release-dry-run.sh --out dist --with-images --with-site-packages "${extra[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kako-release
          path: dist/
          if-no-files-found: error

  push-image:
    name: Push SQL image
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.package.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kako-release
          path: dist
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load, tag, and push
        id: push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          image="ghcr.io/sannrox/kako:${version}"
          docker load -i dist/kako-sql-image.tar
          docker tag "kako-sql:${version}" "$image"
          docker push "$image"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image")"
          echo "image=${image}=${digest#*@}" >>"$GITHUB_OUTPUT"

  attest:
    name: Attest artifacts
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.package.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      provenance: ${{ steps.provenance.outputs.attestation-url }}
      sbom: ${{ steps.sbom.outputs.attestation-url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kako-release
          path: dist
      - name: Attest provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/kako-*.tar.gz
            dist/kako-*-image.tar
            dist/kako.cdx.json
            dist/SHA256SUMS
      - name: Attest SBOM
        id: sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/kako-*.tar.gz
            dist/kako-*-image.tar
          sbom-path: dist/kako.cdx.json

  publish:
    name: GitHub Release
    needs: [package, attest, push-image]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.package.result == 'success' && needs.attest.result == 'success' && needs.push-image.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kako-release
          path: dist
      - name: Write release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.push-image.outputs.image }}
          PROVENANCE: ${{ needs.attest.outputs.provenance }}
          SBOM: ${{ needs.attest.outputs.sbom }}
        run: |
          set -euo pipefail
          # Gate flags come from the labels of every pull request squashed into
          # prev..tag, whatever branch it merged into. The baseline is the
          # nearest final (non-pre-release) ancestor tag, so a final release
          # also carries gates first seen in its release candidates.
          # Without a final tag, start at the first pull request: the commits
          # before it are the repository bootstrap and carry no labels.
          prev="$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-*' "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [[ -z "$prev" ]]; then
            prev="$(git log --reverse --format='%H %s' "$GITHUB_SHA" | awk '!found && /\(#[0-9]+\)$/ { print $1; found = 1 }')^"
          fi
          subjects="$(git log --format='%h %s' "${prev}..${GITHUB_SHA}")"
          # Fail closed: a commit with no pull request, or any lookup error,
          # fails the step instead of dropping a gate.
          if unattributed="$(grep -vE '\(#[0-9]+\)$' <<<"$subjects")"; then
            echo "commits without a pull request reference since ${prev}:" >&2
            echo "$unattributed" >&2
            exit 1
          fi
          labels=()
          prs="$(sed -nE 's/.*\(#([0-9]+)\)$/\1/p' <<<"$subjects" | sort -un)"
          while IFS= read -r pr; do
            names="$(gh pr view "$pr" --json labels --jq '.labels[].name')"
            while IFS= read -r label; do
              if [[ -n "$label" ]]; then labels+=(--label "$label"); fi
            done <<<"$names"
          done <<<"$prs"
          python3 scripts/release-manifest.py \
            --version "${TAG#v}" --git-sha "$GITHUB_SHA" --tag "$TAG" \
            --dist dist --out dist/kako-release.json \
            --image "$IMAGE" --attestation "$PROVENANCE" --attestation "$SBOM" \
            "${labels[@]}"
      # The manifest's own provenance attestation is its signature for Tenkai.
      - name: Sign release manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/kako-release.json
      - name: Notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/changelog-notes.py "${TAG#v}" >dist/RELEASE_NOTES.md
      - name: Draft then publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files=(dist/kako-*.tar.gz dist/kako-*-image.tar dist/kako.cdx.json dist/kako-release.json dist/SHA256SUMS)
          # A rerun after a partial failure finds the draft and finishes it.
          # A published release is immutable; never replace its assets.
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$draft" != true ]]; then
              echo "release ${TAG} is already published" >&2
              exit 1
            fi
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --draft --verify-tag \
              --title "$TAG" --notes-file dist/RELEASE_NOTES.md
          fi
          gh release edit "$TAG" --title "$TAG" --notes-file dist/RELEASE_NOTES.md --draft=false
