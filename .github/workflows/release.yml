name: Release

# Runs from main for a signed tag: release-dispatch.yml starts it on a v* tag
# push, and a failed run is fixed on main and re-run for the same tag. Logic
# lives in scripts/release/; tests/release/ tests it and this file's structure.
on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-dispatch.yml"
      - "scripts/release/**"
      - "tests/**"
      - "security/**"
      - "CHANGELOG.md"
      - "runtime/sql/**"
      - "runtime/python/Dockerfile"
      - "runtime/python/requirements.txt"
      - "runtime/python/kako_run.py"
      - "docs/decisions/0008-release-artifacts.md"
  workflow_dispatch:
    inputs:
      tag:
        description: Signed vX.Y.Z or vX.Y.Z-rc.N tag to release from main; empty for a dry run
        required: false
        default: ""
        type: string

# One run per tag at a time, and a running tagged run is never cancelled.
# GitHub keeps only the newest waiting run per group, so a third dispatch for
# the same tag replaces a queued one. A new push to a pull request cancels its
# stale dry run.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ !inputs.tag }}

permissions:
  contents: read

# Pull requests and workflow_dispatch without a tag are dry runs: they package
# the same files and never mint attestations, push images, or touch a Release.
jobs:
  # Resolves the release commit every later job checks out. A tagged run must
  # come from main: main's scripts/release/verify-tag.sh checks the signed tag against
  # the allowlist on origin/main and the tagged commit's Cargo.toml, and that
  # commit must be on main. A dry run resolves the checked-out commit.
  verify-tag:
    name: Verify signed tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Refuse a tagged run that is not from main
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_REF" == refs/heads/main ]] || { echo "tagged release runs must start from refs/heads/main, not ${WORKFLOW_REF}" >&2; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta)\.[0-9]+)?$ ]] || { echo "invalid release tag: ${TAG}" >&2; exit 1; }
      - name: Check out main's release-tag verifier
        if: inputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: main-tree
          persist-credentials: false
      # Full history: the signer allowlist is read from origin/main.
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      # checkout may leave a lightweight ref; fetch the real tag object.
      - name: Refuse unsigned, lightweight, or mismatched tags
        if: inputs.tag != ''
        working-directory: source
        env:
          TAG: ${{ inputs.tag }}
          MAIN_TREE: ${{ github.workspace }}/main-tree
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" "+refs/heads/main:refs/remotes/origin/main"
          sha="$(git rev-parse "${TAG}^{commit}")"
          RELEASE_TRUST_REF=origin/main bash "${MAIN_TREE}/scripts/release/verify-tag.sh" verify "$TAG" "$sha"
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main || { echo "tag ${TAG} commit ${sha} is not on main" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$sha"
      - name: Refuse a published release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: bash main-tree/scripts/release/github-release.sh guard "$TAG"
      - name: Resolve release commit
        id: resolve
        working-directory: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          # A tag with a "-" (vX.Y.Z-rc.N) is a pre-release and never latest.
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
          fi

  # The release tests are the tagged commit's own. Main's
  # release.yml, which is what runs here, was gated by the pull request that
  # changed it.
  tests:
    name: Release tests
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          persist-credentials: false
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r tests/requirements.txt
      - run: python -m unittest discover -s tests -t . -v

  package:
    name: Package artifacts
    needs: [verify-tag, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          persist-credentials: false
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Package
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          extra=()
          if [[ -n "$TAG" ]]; then
            extra+=(--version "${TAG#v}")
          fi
          bash scripts/release/package.sh --out dist --with-images --with-site-packages "${extra[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kako-release
          path: dist/
          if-no-files-found: error

  # Native arm64 SQL image tar. The amd64 tar comes from package; this job
  # skips the Python image so a lockfile without arm64 wheels cannot block it.
  sql-image-arm64:
    name: Package SQL image (arm64)
    needs: [verify-tag, tests]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          persist-credentials: false
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Package SQL image
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          extra=()
          if [[ -n "$TAG" ]]; then
            extra+=(--version "${TAG#v}")
          fi
          bash scripts/release/package.sh --out dist --with-sql-image "${extra[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kako-sql-image-arm64
          path: dist/kako-sql-image.tar
          if-no-files-found: error

  push-image:
    name: Push SQL image
    needs: [verify-tag, package, sql-image-arm64]
    if: needs.verify-tag.outputs.tag != '' && needs.package.result == 'success' && needs.sql-image-arm64.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          persist-credentials: false
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      # "Re-run failed jobs" reuses verify-tag's outputs, so this job checks
      # again before it changes anything. Only a draft or no release passes.
      - name: Refuse a published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: bash scripts/release/github-release.sh guard "$TAG"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kako-release
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kako-sql-image-arm64
          path: dist-arm64
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load, tag, and push
        id: push
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: bash scripts/release/push-image.sh "$TAG" dist/kako-sql-image.tar dist-arm64/kako-sql-image.tar >>"$GITHUB_OUTPUT"

  attest:
    name: Attest artifacts
    needs: [verify-tag, package]
    if: needs.verify-tag.outputs.tag != '' && needs.package.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      provenance: ${{ steps.provenance.outputs.attestation-url }}
      sbom: ${{ steps.sbom.outputs.attestation-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          persist-credentials: false
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      # "Re-run failed jobs" reuses verify-tag's outputs, so this job checks
      # again before it changes anything. Only a draft or no release passes.
      - name: Refuse a published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: bash scripts/release/github-release.sh guard "$TAG"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kako-release
          path: dist
      - name: Attest provenance
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/kako-*.tar.gz
            dist/kako-*-image.tar
            dist/kako.cdx.json
            dist/SHA256SUMS
      - name: Attest SBOM
        id: sbom
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-path: |
            dist/kako-*.tar.gz
            dist/kako-*-image.tar
          sbom-path: dist/kako.cdx.json

  # The only job that touches the GitHub Release, and the last one: a failure
  # anywhere leaves at most a draft that a re-run for the same tag resumes.
  publish:
    name: GitHub Release
    needs: [verify-tag, package, attest, push-image]
    if: needs.verify-tag.outputs.tag != '' && needs.package.result == 'success' && needs.attest.result == 'success' && needs.push-image.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.verify-tag.outputs.tag }}
      SHA: ${{ needs.verify-tag.outputs.sha }}
      PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Require HEAD at the release commit
        run: test "$(git rev-parse HEAD)" = "$SHA"
      # "Re-run failed jobs" reuses verify-tag's outputs, so this job checks
      # again before it changes anything. Only a draft or no release passes.
      - name: Refuse a published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: bash scripts/release/github-release.sh guard "$TAG"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kako-release
          path: dist
      # Gate flags come from the labels of the pull requests in the release
      # range; manifest.py fails closed on any lookup error.
      - name: Write release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ${{ needs.push-image.outputs.image }}
          PROVENANCE: ${{ needs.attest.outputs.provenance }}
          SBOM: ${{ needs.attest.outputs.sbom }}
        run: |
          python3 scripts/release/manifest.py \
            --version "${TAG#v}" --git-sha "$SHA" --tag "$TAG" \
            --dist dist --out dist/kako-release.json \
            --image "$IMAGE" --attestation "$PROVENANCE" --attestation "$SBOM" \
            --labels-from-history
      # The manifest's own provenance attestation is its signature for Tenkai.
      - name: Sign release manifest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/kako-release.json
      # package.sh wrote dist/RELEASE_NOTES.md from CHANGELOG.md.
      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          bash scripts/release/github-release.sh draft "$TAG" "$PRERELEASE" dist/RELEASE_NOTES.md
          dist/kako-*.tar.gz dist/kako-*-image.tar dist/kako.cdx.json dist/kako-release.json dist/SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/release/github-release.sh publish "$TAG" "$PRERELEASE"
