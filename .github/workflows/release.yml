name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release-dry-run.sh"
      - "runtime/sql/**"
      - "runtime/python/Dockerfile"
      - "runtime/python/requirements.txt"
      - "runtime/python/kako_run.py"
      - "docs/decisions/0008-release-artifacts.md"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its previous run; other events run
# every commit. The workflow name keeps workflows from cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Package artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Package
        run: |
          extra=()
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            extra+=(--version "${GITHUB_REF_NAME#v}")
          fi
          bash scripts/release-dry-run.sh --out dist --with-images --with-site-packages "${extra[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kako-release
          path: dist/
          if-no-files-found: error

  attest:
    name: Attest artifacts
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kako-release
          path: dist
      - name: Attest artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/kako-*.tar.gz
            dist/kako-*-image.tar
            dist/SHA256SUMS

  publish:
    name: GitHub Release
    needs: [package, attest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kako-release
          path: dist
      - name: Notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          python3 - "$version" <<'PY'
          import pathlib, sys
          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text()
          heading = f"## [{version}]"
          start = text.find(heading)
          if start < 0:
              raise SystemExit(f"CHANGELOG.md has no {heading} section")
          rest = text[start + len(heading):]
          nxt = rest.find("\n## [")
          body = rest if nxt < 0 else rest[:nxt]
          pathlib.Path("dist/RELEASE_NOTES.md").write_text(heading + body)
          PY
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/kako-*.tar.gz dist/kako-*-image.tar dist/SHA256SUMS \
            --title "$TAG" \
            --notes-file dist/RELEASE_NOTES.md
