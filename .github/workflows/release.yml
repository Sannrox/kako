name: Release

# Runs from main for a signed tag: release-dispatch.yml starts it on a v* tag
# push, and a failed run is fixed on main and re-run for the same tag.
on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-dispatch.yml"
      - "scripts/release-dry-run.sh"
      - "scripts/verify-release-tag.sh"
      - "scripts/changelog-notes.py"
      - "scripts/release-manifest.py"
      - "scripts/release-sbom.py"
      - "scripts/validate-release.sh"
      - "security/**"
      - "CHANGELOG.md"
      - "runtime/sql/**"
      - "runtime/python/Dockerfile"
      - "runtime/python/requirements.txt"
      - "runtime/python/kako_run.py"
      - "docs/decisions/0008-release-artifacts.md"
  workflow_dispatch:
    inputs:
      tag:
        description: Signed vX.Y.Z or vX.Y.Z-rc.N tag to release from main; empty for a dry run
        required: false
        default: ""
        type: string

# One run per tag at a time, and a running tagged run is never cancelled.
# GitHub keeps only the newest waiting run per group, so a third dispatch for
# the same tag replaces a queued one. A new push to a pull request cancels its
# stale dry run.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ !inputs.tag }}

permissions:
  contents: read

# Pull requests and workflow_dispatch without a tag are dry runs: they package
# the same files and never mint attestations, push images, or touch a Release.
jobs:
  # Resolves the release commit every later job checks out. A tagged run must
  # come from main: main's verify-release-tag.sh checks the signed tag against
  # the allowlist on origin/main and the tagged commit's Cargo.toml, and that
  # commit must be on main. A dry run resolves the checked-out commit.
  verify-tag:
    name: Verify signed tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Refuse a tagged run that is not from main
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_REF" == refs/heads/main ]] || { echo "tagged release runs must start from refs/heads/main, not ${WORKFLOW_REF}" >&2; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta)\.[0-9]+)?$ ]] || { echo "invalid release tag: ${TAG}" >&2; exit 1; }
      - name: Check out main's release-tag verifier
        if: inputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: main-tree
      # Full history: the signer allowlist is read from origin/main.
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          path: source
          fetch-depth: 0
      # checkout may leave a lightweight ref; fetch the real tag object.
      - name: Refuse unsigned, lightweight, or mismatched tags
        if: inputs.tag != ''
        working-directory: source
        env:
          TAG: ${{ inputs.tag }}
          MAIN_TREE: ${{ github.workspace }}/main-tree
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" "+refs/heads/main:refs/remotes/origin/main"
          sha="$(git rev-parse "${TAG}^{commit}")"
          RELEASE_TRUST_REF=origin/main bash "${MAIN_TREE}/scripts/verify-release-tag.sh" verify "$TAG" "$sha"
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main || { echo "tag ${TAG} commit ${sha} is not on main" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$sha"
      - name: Refuse a published release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - name: Resolve release commit
        id: resolve
        working-directory: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          # A tag with a "-" (vX.Y.Z-rc.N) is a pre-release and never latest.
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
          fi

  # The CI gate runs the tagged commit's own release checks. Main's
  # release.yml, which is what runs here, was gated by the pull request that
  # changed it.
  scripts:
    name: Release scripts
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - run: bash scripts/validate-release.sh

  package:
    name: Package artifacts
    needs: [verify-tag, scripts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Package
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          extra=()
          if [[ -n "$TAG" ]]; then
            extra+=(--version "${TAG#v}")
          fi
          bash scripts/release-dry-run.sh --out dist --with-images --with-site-packages "${extra[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kako-release
          path: dist/
          if-no-files-found: error

  push-image:
    name: Push SQL image
    needs: [verify-tag, package]
    if: needs.verify-tag.outputs.tag != '' && needs.package.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      # "Re-run failed jobs" reuses verify-tag's outputs, so this job checks
      # again before it changes anything. Only a draft or no release passes.
      - name: Refuse a published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kako-release
          path: dist
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load, tag, and push
        id: push
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          image="ghcr.io/sannrox/kako:${version}"
          docker load -i dist/kako-sql-image.tar
          docker tag "kako-sql:${version}" "$image"
          docker push "$image"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image")"
          echo "image=${image}=${digest#*@}" >>"$GITHUB_OUTPUT"

  attest:
    name: Attest artifacts
    needs: [verify-tag, package]
    if: needs.verify-tag.outputs.tag != '' && needs.package.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      provenance: ${{ steps.provenance.outputs.attestation-url }}
      sbom: ${{ steps.sbom.outputs.attestation-url }}
    steps:
      # "Re-run failed jobs" reuses verify-tag's outputs, so this job checks
      # again before it changes anything. Only a draft or no release passes.
      - name: Refuse a published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kako-release
          path: dist
      - name: Attest provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/kako-*.tar.gz
            dist/kako-*-image.tar
            dist/kako.cdx.json
            dist/SHA256SUMS
      - name: Attest SBOM
        id: sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/kako-*.tar.gz
            dist/kako-*-image.tar
          sbom-path: dist/kako.cdx.json

  # The only job that touches the GitHub Release, and the last one: a failure
  # anywhere leaves at most a draft that a re-run for the same tag resumes.
  publish:
    name: GitHub Release
    needs: [verify-tag, package, attest, push-image]
    if: needs.verify-tag.outputs.tag != '' && needs.package.result == 'success' && needs.attest.result == 'success' && needs.push-image.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.verify-tag.outputs.tag }}
      SHA: ${{ needs.verify-tag.outputs.sha }}
      PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Require HEAD at the release commit
        run: test "$(git rev-parse HEAD)" = "$SHA"
      # "Re-run failed jobs" reuses verify-tag's outputs, so this job checks
      # again before it changes anything. Only a draft or no release passes.
      - name: Refuse a published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kako-release
          path: dist
      - name: Write release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.push-image.outputs.image }}
          PROVENANCE: ${{ needs.attest.outputs.provenance }}
          SBOM: ${{ needs.attest.outputs.sbom }}
        run: |
          set -euo pipefail
          # Gate flags come from the labels of every pull request squashed into
          # prev..tag, whatever branch it merged into. The baseline is the
          # nearest final (non-pre-release) ancestor tag, so a final release
          # also carries gates first seen in its release candidates.
          # Without a final tag, start at the first pull request: the commits
          # before it are the repository bootstrap and carry no labels.
          prev="$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-*' "${SHA}^" 2>/dev/null || true)"
          if [[ -z "$prev" ]]; then
            prev="$(git log --reverse --format='%H %s' "$SHA" | awk '!found && /\(#[0-9]+\)$/ { print $1; found = 1 }')^"
          fi
          subjects="$(git log --format='%h %s' "${prev}..${SHA}")"
          # Fail closed: a commit with no pull request, or any lookup error,
          # fails the step instead of dropping a gate.
          if unattributed="$(grep -vE '\(#[0-9]+\)$' <<<"$subjects")"; then
            echo "commits without a pull request reference since ${prev}:" >&2
            echo "$unattributed" >&2
            exit 1
          fi
          labels=()
          prs="$(sed -nE 's/.*\(#([0-9]+)\)$/\1/p' <<<"$subjects" | sort -un)"
          while IFS= read -r pr; do
            names="$(gh pr view "$pr" --json labels --jq '.labels[].name')"
            while IFS= read -r label; do
              if [[ -n "$label" ]]; then labels+=(--label "$label"); fi
            done <<<"$names"
          done <<<"$prs"
          python3 scripts/release-manifest.py \
            --version "${TAG#v}" --git-sha "$SHA" --tag "$TAG" \
            --dist dist --out dist/kako-release.json \
            --image "$IMAGE" --attestation "$PROVENANCE" --attestation "$SBOM" \
            "${labels[@]}"
      # The manifest's own provenance attestation is its signature for Tenkai.
      - name: Sign release manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/kako-release.json
      - name: Notes from CHANGELOG
        run: python3 scripts/changelog-notes.py "${TAG#v}" >dist/RELEASE_NOTES.md
      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(dist/kako-*.tar.gz dist/kako-*-image.tar dist/kako.cdx.json dist/kako-release.json dist/SHA256SUMS)
          kind=()
          if [[ "$PRERELEASE" == true ]]; then
            kind=(--prerelease --latest=false)
          fi
          # A re-run after a partial failure resumes the draft. A published
          # release is immutable; never replace its assets.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
            # Every run rebuilds every asset; drop the earlier run's so a
            # stale or renamed asset is never published.
            gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
              gh release delete-asset "$TAG" "$name" --yes
            done
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file dist/RELEASE_NOTES.md --draft "${kind[@]}"
          elif [[ "$state" == *"release not found"* ]]; then
            gh release create "$TAG" "${files[@]}" --draft --verify-tag "${kind[@]}" \
              --title "$TAG" --notes-file dist/RELEASE_NOTES.md
          else
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]]; then
            echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2
            exit 1
          fi
          if [[ "$PRERELEASE" == true ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false
          fi
