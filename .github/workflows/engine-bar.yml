name: Engine bar

# Scale-factor engine bar (docs/engine-requirements.md): mizuchi against the
# default engine at SF1 and SF10 under the same sandbox limits. Not part of
# pull-request CI except when the harness itself changes.
on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/engine-bar/sf/**
      - .github/workflows/engine-bar.yml

env:
  CARGO_TERM_COLOR: always

# A new push to a pull request cancels its previous run; other events run
# every commit. The workflow name keeps workflows from cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine-bar:
    name: Engine bar SF${{ matrix.scale }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        scale: ["1", "10"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Run engine bar
        run: bash scripts/ci-cgroup-delegate.sh bash scripts/engine-bar/sf/run.sh "${{ matrix.scale }}" "engine-bar-sf${{ matrix.scale }}"
      - name: Report
        if: always()
        run: python3 scripts/engine-bar/sf/report.py "engine-bar-sf${{ matrix.scale }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-bar-sf${{ matrix.scale }}
          path: engine-bar-sf${{ matrix.scale }}
