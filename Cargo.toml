[workspace]
members = [
    "crates/kako-core",
    "crates/kako-sandbox",
    "crates/kako-engine-duckdb",
    "crates/kako-engine-mizuchi",
    "crates/kako-engine-python",
    "crates/kako-worker",
    "crates/kako-source-sekai",
    "crates/kako",
]
default-members = ["crates/kako"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Sannrox/kako"
# Off while kekkai and the opt-in SQL engine are git pins (ADR 0008).
publish = false

[workspace.dependencies]
kako-core = { path = "crates/kako-core" }
kako-sandbox = { path = "crates/kako-sandbox" }
kako-engine-duckdb = { path = "crates/kako-engine-duckdb" }
kako-engine-mizuchi = { path = "crates/kako-engine-mizuchi" }
kako-engine-python = { path = "crates/kako-engine-python" }
kako-worker = { path = "crates/kako-worker" }
kako-source-sekai = { path = "crates/kako-source-sekai" }
arrow = { version = "60.0.0", default-features = false, features = ["csv"] }
duckdb = { version = "=1.10506.0", default-features = false, features = ["bundled", "parquet"] }
kekkai = { git = "https://github.com/Sannrox/kekkai", rev = "73e24f580ed6223b7e8395793e6f2317eb8edfd9", default-features = false, features = ["guest"] }
mizuchi = { git = "https://github.com/Sannrox/mizuchi", rev = "1c2e13030bfd94f2cdea6ac8aec277f651391a47", default-features = false }
# Git pin until sekai-keys is on crates.io.
sekai-keys = { git = "https://github.com/Sannrox/sekai-chisei.git", rev = "1b2e12789a2b360759a087252367cf4bc633caf0" }
aes-gcm = "0.10"
rand = { version = "0.8", features = ["std"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
libc = "0.2"
tempfile = "3"

# Dependencies build without debug info in dev and test builds: backtraces
# and debuggers keep full detail for workspace crates, and build directories
# stay a fraction of the size.
[profile.dev.package."*"]
debug = false
