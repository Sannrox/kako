[package]
name = "kako-source-sekai"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Sekai isolated-process JobSource adapter for kako"

[features]
default = []
# Real runtime-claim client. Tests use the fake transport without this feature.
sekai-client = [
    "dep:sekai-client",
    "dep:sha2",
    "dep:tokio",
    "dep:futures-util",
]

[dependencies]
kako-core = { workspace = true }
sekai-client = { git = "https://github.com/Sannrox/sekai-chisei", rev = "2c2759d5a2e02d2ad3e4846483a296afbf2e01be", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "time"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
