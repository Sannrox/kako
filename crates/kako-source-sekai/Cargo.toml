[package]
name = "kako-source-sekai"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Sekai isolated-process JobSource adapter for kako"

[features]
default = []
# Real runtime-claim client. Tests use the fake transport without this feature.
sekai-client = ["dep:sekai-client", "dep:sha2", "dep:serde_json"]

[dependencies]
kako-core = { workspace = true }
sekai-client = { git = "https://github.com/Sannrox/sekai-chisei", rev = "dccc1e704adf21057bcaa435aef90660db0e9c52", optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
