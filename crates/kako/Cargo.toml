[package]
name = "kako"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Sandboxed data-transform runner: runs SQL (DuckDB) and Python transforms as isolated jobs from pluggable job sources, with receipts."
keywords = ["etl", "duckdb", "sandbox", "data", "transform"]
categories = ["command-line-utilities", "database"]
homepage = "https://github.com/Sannrox/kako"

[features]
default = []
sekai = ["dep:kako-source-sekai", "kako-source-sekai/sekai-client"]

[dependencies]
kako-core = { workspace = true }
kako-source-sekai = { workspace = true, optional = true }
kako-engine-python = { workspace = true }
kako-sandbox = { workspace = true }
kako-worker = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
