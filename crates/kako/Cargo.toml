[package]
name = "kako"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Sandboxed data-transform runner: runs SQL (DuckDB) and Python transforms as isolated jobs from pluggable job sources, with receipts."
keywords = ["etl", "duckdb", "sandbox", "data", "transform"]
categories = ["command-line-utilities", "database"]
homepage = "https://github.com/Sannrox/kako"

[dependencies]
duckdb = { version = "=1.10506.0", features = ["bundled", "parquet"] }
kekkai = { git = "https://github.com/Sannrox/kekkai", rev = "7709d8a179ba499d319f5607dfbef0d68b869fef" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
